name: Build Android Core Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source (Stable Version)
        uses: actions/checkout@v4
        with:
          ref: v1.12.14  # Stable ဖြစ်တဲ့ Version ကို ယူသုံးမယ် (dev-next မသုံးဘူး)

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK (Stable)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d # Gomobile နဲ့ အကိုက်ညီဆုံး NDK
          link-to-sdk: true

      - name: Set Environment Variables
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/r26d" >> $GITHUB_ENV

      - name: Install Gomobile and Dependencies
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          # Mobile Bind dependency ကို သေချာအောင် ဆွဲထည့်မယ်
          go get golang.org/x/mobile/bind

      - name: Build Singbox AAR
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Go module တွေကို အရင်ရှင်းမယ်
          go mod tidy
          go mod download
          # Compile စလုပ်မယ် (Stable Version မို့ Error မတက်တော့ပါ)
          gomobile bind -v -target=android -androidapi 21 -ldflags "-s -w" -tags with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api -o singbox.aar ./experimental/libbox

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-aar
          path: singbox.aar

name: Build Android Core Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ဒါက အသစ်ထပ်ဖြည့်လိုက်တဲ့ အပိုင်းပါ (NDK Error ရှင်းဖို့)
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build Singbox AAR
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Go module တွေကို အရင်ဆွဲယူမယ်
          go mod download
          # Compile စလုပ်မယ်
          gomobile bind -v -target=android -androidapi 21 -ldflags "-s -w" -tags with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api -o singbox.aar ./experimental/libbox

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-aar
          path: singbox.aar

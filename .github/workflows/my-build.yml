name: Build Singbox Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official Stable Source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box # Official Repo ကို တိုက်ရိုက်လှမ်းယူမယ်
          ref: v1.11.4                  # အငြိမ်ဆုံး Version ကို ရွေးမယ် (Error ကင်းတယ်)

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'            # v1.11.4 နဲ့ အကိုက်ညီဆုံး Go version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Gomobile
        run: |
          # Go Module တွေကို ရှင်းမယ်
          go env -w GO111MODULE=on
          
          # Gomobile ကို သွင်းမယ်
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          # Path လမ်းကြောင်း ပေးမယ်
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Gomobile init
          gomobile init

      - name: Build AAR
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Dependency တွေကို သေချာဆွဲမယ်
          go mod download
          go get golang.org/x/mobile/bind
          
          # Compile လုပ်မယ် (Tags တွေ အကုန်ပါမယ်)
          gomobile bind -v -target=android -androidapi 21 -ldflags "-s -w" -tags with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api -o singbox.aar ./experimental/libbox

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-aar
          path: singbox.aar
